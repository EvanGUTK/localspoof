[package]
name = "localspoof-desktop"
version = "0.8.2"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }

[dependencies]
tauri-plugin-updater = { version = "=2.9.0", path = "../vendor/tauri-plugin-updater", default-features=false, features= ["rustls-tls"] }
base64 = "=0.22.1"
ring = "=0.17.14"
sha2 = "=0.10.9"
semver = "=1.0.27"
minisign-verify = "=0.2.4"
tauri = { version = "=2.9.5", features = [] }
# Tauri 2.9.5's runtime-wry requires this runtime interface, not the newer 2.12 API.
tauri-runtime = "=2.9.2"
tauri-macros = "=2.5.2"
tauri-utils = "=2.8.1"
tauri-codegen = "=2.5.2"
localspoof-native = { path = "../native" }
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }

[[bin]]
name = "localspoof-desktop"
path = "src/main.rs"
